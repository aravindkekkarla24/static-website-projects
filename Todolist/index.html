<!DOCTYPE html>
<html>

<head>
    <link rel = "stylesheet" href = "index.css">
</head>

<body>
    <div class="todo-card">
        <div class="card-header">
            <h1 class="todo-card-title">Todo List</h1>
            <h3 class="todo-card-caption">Each day i will accomplish one thing on my todo list.</h3>
        </div>

        <div>
            <p class="todo-title">Read a Book</p>
            <p class="todo-description">I don't think that the human race will survive the next thousand years, unless we spread into space. There are too many accidents that can befall life on a single planet. But I'm an optimist...</p>
        </div>


        <div class="todo-card-footer">
            <button class="button">Start</button>
            <p class="text">Dont't skip introduction</p>
        </div>
    </div>
</body>

</html>
